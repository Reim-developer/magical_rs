name: Test the crate before merge/push.

on:
    push:
        branches: [ "dev"]
      
    # dev is the branch that has to be green before anything reaches master, so
    # a pull request into either of them is checked. Without master here, a PR
    # that lands the crate on master would carry no crate check at all, and
    # requiring one in branch protection would make every merge impossible.
    pull_request:
        branches: [ "dev", "master"]

env:
  CARGO_TERM_COLOR: always
    
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> $GITHUB_PATH
        
        - name: Add Rust component
          shell: bash
          run: |
            rustup component add clippy rustfmt

        # Before the linter, so a formatting failure is not read as a lint
        # failure. Neither rewrites the checkout: `--check` only reports, and a
        # contributor fixes it with `make fmt` locally.
        - name: Format check
          shell: bash
          run: |
            make fmt

        - name: Linter check
          shell: bash
          run: |
            make linter
        
        - name: Test default feature
          shell: bash
          run: |
            make test

        - name: Test feature magical_dyn
          shell: bash
          run: |
            make test-dyn

        # This one was in the Makefile from 2025-08-07 and was never added here.
        # `make linter` compiles it, because clippy runs with --all-features, so
        # the code was always built; nothing ever ran the tests against it.
        - name: Test feature unsafe_context
          shell: bash
          run: |
            make test-unsafe

        # `magical_fluent` for the reason the step above exists: a gated feature's
        # code is compiled by `make linter` (clippy runs --all-features) and run by
        # nothing unless a target says otherwise.
        - name: Test feature magical_fluent
          shell: bash
          run: |
            make test-fluent

        # The readme advertises `no_std` support, and nothing above checks it.
        # `make test` runs with default features, which include `std`.
        - name: Test and build without std
          shell: bash
          run: |
            make test-nostd

        # The readme's first paragraph advertises WebAssembly support, and
        # nothing above checks it. `make test-nostd` proves `no_std` against a
        # bare-metal ARM target, which is a different claim about a different
        # target.
        - name: Build for WebAssembly
          shell: bash
          run: |
            make build-wasm

        # Last, because it is the slowest and the least likely to be the thing
        # that broke. Each example is a separate crate, so nothing above it
        # compiles any of them; they are run rather than built, which is the
        # only thing that catches an example that compiles and is wrong.
        - name: Run the examples
          shell: bash
          run: |
            make examples
