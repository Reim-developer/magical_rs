name: Publish to PyPI.

on:
    # A tag is the only trigger, and it is a tag naming the Python package
    # specifically. The Rust crate carries its own `v` tags, so publishing is
    # keyed on `py-v` and the two artifacts cannot collide.
    #
    # There is deliberately no `workflow_dispatch`. A publish that can be
    # triggered by a button is a publish that will eventually be triggered by a
    # button by accident, and PyPI does not let a version be reused.
    push:
        tags: [ "py-v*" ]

env:
    CARGO_TERM_COLOR: always
    # The extension has no Python dependency to link against, so nothing here
    # should reach for one.
    PYO3_NO_PYTHON: "1"

jobs:
    guard:
        # Two mistakes that cannot be undone once the version is on PyPI, so
        # they are checked in seconds before anything is built. Everything
        # else in this workflow assumes these hold.
        name: Check the tag against the package
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
              # The next step needs master to be present, not just the tag.
              fetch-depth: 0

        - name: The tag must name the version that is in pyproject.toml
          shell: bash
          run: |
            tag_version="${GITHUB_REF_NAME#py-v}"
            package_version="$(python3 -c '
            import tomllib
            with open("bindings/python/pyproject.toml", "rb") as f:
                print(tomllib.load(f)["project"]["version"])
            ')"
            echo "tag says    : $tag_version"
            echo "package says: $package_version"
            if [ "$tag_version" != "$package_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml."
              exit 1
            fi

        - name: The tag must be on master
          shell: bash
          run: |
            # A release of something that never reached master is a release of
            # code the ruleset on master has not seen.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$GITHUB_REF_NAME is not on master. Merge it first."
              git log --oneline -1 "$GITHUB_SHA"
              exit 1
            fi
            echo "on master, as it should be"

    wheels:
        # abi3 means one wheel covers CPython 3.8 and later, so the matrix
        # varies the platform and the Python used to *build* it, not the
        # minimum it runs on. All four are published, because a Linux wheel
        # alone would leave Windows and macOS users building from source.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    # An Intel runner, because an x86_64 wheel cannot be
                    # installed on an arm64 one. Both macOS entries cannot
                    # share `macos-latest`, which is arm64: cross compiling
                    # produced a correct x86_64 wheel that the test step then
                    # refused to install.
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        runs-on: ${{ matrix.os }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: "3.12"

        - name: Build the wheel
          shell: bash
          env:
              # `uv build` has no `--target`, so this is how the target reaches
              # maturin. Without it maturin builds for the *host*, and both
              # macOS legs run on the same arm64 runner, so both produced a
              # wheel named `...macosx_11_0_arm64.whl`. Two artifacts, one
              # filename, and the Intel Mac had no wheel at all.
              CARGO_BUILD_TARGET: ${{ matrix.target }}
          run: |
            rustup target add ${{ matrix.target }}
            # `--python`, not `--interpreter`: `uv build` has no such flag and
            # exits 2 without building anything.
            uv build bindings/python \
              --out-dir dist \
              --python python

        - name: Check the wheel installs and works
          shell: bash
          run: |
            # The wheel must be the one this matrix entry was asked for.
            # Building the right target is not the same as labelling the wheel
            # with it, and only the filename records what PyPI will believe.
            # This is what caught the arm64-Intel-Mac wheel: the build succeeded
            # and every assertion below passed, on the wrong architecture.
            wheels=(dist/*.whl)
            if [ "${#wheels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one wheel in dist, found ${#wheels[@]}."
              exit 1
            fi
            name=$(basename "${wheels[0]}")
            # The architecture, derived from the target triple, because the two
            # spell it differently: the triple says aarch64 and pc-windows-msvc,
            # the wheel tag says arm64 and win_amd64. A target with no rule here
            # fails rather than passing unchecked, since a wheel whose
            # architecture was never verified is the bug this is here to catch.
            case "${{ matrix.target }}" in
              aarch64-*)      want=arm64 ;;
              *-windows-msvc) want=amd64 ;;
              x86_64-*)       want=x86_64 ;;
              *)
                echo "::error::No wheel architecture is known for ${{ matrix.target }}. Add a rule for it."
                exit 1
                ;;
            esac
            # The platform tag is whatever follows the last hyphen. `x86_64`
            # cannot be found by splitting on underscores, because it contains
            # one: that yields 64.
            plat="${name%.whl}"; plat="${plat##*-}"
            echo "built $name -> $plat (want $want)"
            # The architecture is bounded by a hyphen or an underscore, since
            # the platform tag's own components are joined with underscores:
            # macosx_11_0_arm64, win_amd64, linux_x86_64.
            case "$plat" in
              *-"$want"|*_"$want") ;;
              *)
                echo "::error::$name has platform tag $plat, which does not end in $want as ${{ matrix.target }} requires."
                exit 1
                ;;
            esac

            uv venv --quiet .wheelcheck
            uv pip install --quiet --python .wheelcheck dist/*.whl
            # Run through `uv run`, not `.wheelcheck/bin/python`. A venv on
            # Windows puts the interpreter in `Scripts`, so the hard-coded path
            # is not executable there and the step fails with exit 127.
            # A wheel that installs but cannot detect anything is worse than no
            # wheel, so the check is a real detection rather than an import.
            uv run --no-project --python .wheelcheck python -c "
            from magical_py import FileKind, detect_bytes, bytes_read
            assert detect_bytes(b'\x89PNG\r\n\x1a\n' + b'\0' * 40) is FileKind.Png
            assert detect_bytes(b'nothing here') is None
            assert bytes_read() == 36_870
            assert len(FileKind) == 114
            print('wheel OK')
            "

        - name: Upload the wheel
          uses: actions/upload-artifact@v4
          with:
              name: wheel-${{ matrix.target }}
              path: dist/*.whl

    sdist:
        # Built once, from linux, and published alongside the wheels so that a
        # platform nobody here builds for is still installable.
        name: Build the sdist
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: "3.12"

        - name: Build the sdist
          shell: bash
          run: uv build bindings/python --sdist --out-dir dist --python python

        - name: Upload the sdist
          uses: actions/upload-artifact@v4
          with:
              name: sdist
              path: dist/*.tar.gz

    publish:
        # The tagged commit reached master through a pull request that the
        # ruleset would not let through unless all seven checks passed, so the
        # gates have already run against this exact tree. Repeating them here
        # would add ten minutes to every release to re-establish a fact the
        # guard step above just checked.
        name: Publish
        needs: [ guard, wheels, sdist ]
        runs-on: ubuntu-latest

        # The environment is what PyPI's trusted publisher is bound to. The
        # token is minted per run and expires with the job, so there is no
        # long-lived secret in this repository to leak or rotate.
        environment: pypi
        permissions:
            id-token: write

        steps:
        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Collect the artifacts
          uses: actions/download-artifact@v4
          with:
              # `pattern` is a glob against the artifact *name*, and the `/` in
              # an earlier version of this line was read as a path separator
              # rather than as "or". No artifact name contains a `/`, so
              # `wheel-*/sdist` matched nothing, the download reported success
              # having downloaded zero artifacts, and the next step failed on a
              # missing directory instead of on a missing upload.
              #
              # Every artifact in this run is either a wheel or the sdist, so
              # `*` is the whole set, and the count check below is what proves
              # it. If an artifact is ever added that is neither, this step
              # sweeps it in and that check fails loudly rather than the file
              # being published by accident.
              pattern: "*"
              path: dist
              merge-multiple: true

        - name: Show what is about to be published
          shell: bash
          run: |
            # One wheel per platform, one sdist. Two artifacts claiming the same
            # filename would make the upload fail, so the list is printed
            # rather than assumed.
            #
            # `dist` is counted even when it does not exist, so that collecting
            # nothing produces the message written for that case. Letting `ls`
            # fail first hid it behind "No such file or directory".
            count=$(ls dist 2>/dev/null | wc -l)
            echo "$count files"
            if [ "$count" -ne 5 ]; then
              echo "::error::Expected 4 wheels and 1 sdist, found $count."
              exit 1
            fi
            ls -l dist

        # No `--directory` on either of these. It is a global uv option meaning
        # "change to this directory first", not "publish the contents of this
        # directory", and uv publish already defaults its file list to
        # `dist/*`. So `--directory dist` changed into dist and then looked for
        # `dist/*` again, one level down, and said:
        #
        #     error: No files found to publish
        #
        # Reproduced locally with a real wheel and a real sdist in dist/:
        # `--directory dist` exits 2, the bare form checks both files.
        - name: Check the upload is accepted before making it
          shell: bash
          run: uv publish --dry-run

        - name: Publish
          shell: bash
          run: uv publish

        - name: Report
          shell: bash
          run: |
            # The tag is `py-v0.1.0` and the version is `0.1.0`. Using the ref
            # name straight in the URL linked to a page that does not exist, so
            # the same prefix strip the guard job does is done here.
            version="${GITHUB_REF_NAME#py-v}"
            echo "::notice::Published $version to PyPI as $GITHUB_REF_NAME."
            echo "https://pypi.org/project/magical-py/$version/"
