name: Test the Python bindings.

on:
    push:
        branches: [ "master", "dev" ]
        paths:
            - "bindings/**"
            - "crates/**"
            - "Cargo.toml"
            - "readme.md"
            # `formats.json` generates `_kinds.py`, so editing the dataset is
            # editing this binding even though nothing under `bindings/` moved.
            - "formats.json"
            # The release machinery is part of the bindings, so editing it gets
            # the same gate as editing the code it releases.
            - ".github/workflows/python_bindings.yml"
            - ".github/workflows/publish.yml"
            # `gates.sh` is what this workflow runs, and it lives here rather
            # than beside the crate it gates, so editing it has to count as
            # editing the bindings.
            - "scripts/**"

    # No `paths` filter here, deliberately, and not for cost reasons. These
    # jobs are required status checks on master, and a required check that
    # never reports is a merge that is blocked forever. A pull request that
    # touches only CHANGELOG.md would skip a filtered workflow entirely, and
    # GitHub would wait on a check that was never going to arrive. The filter
    # stays on `push` above, where nothing is waiting on a result.
    pull_request:

env:
  CARGO_TERM_COLOR: always
  # The extension has no Python dependency to link against, so nothing here
  # should reach for one.
  PYO3_NO_PYTHON: "1"

jobs:
    checks:
        # One platform is enough to catch a mistake in the Rust or Python
        # source. What differs per platform is the linker, so the wheel
        # matrix below covers that separately.
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # The package declares requires-python >= 3.8, so the floor is
                # tested as well as a current release. A single interpreter
                # would not do: Python 3.8's pydoc renders `help()` without
                # enum member docstrings, which 3.9 and later do render, so the
                # readme claims and the tests only agreed on 3.9+.
                python-version: [ "3.8", "3.12" ]

        env:
            # uv picks whichever interpreter it likes when left to itself, which
            # would quietly make the matrix meaningless.
            UV_PYTHON: ${{ matrix.python-version }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Add Rust component
          shell: bash
          run: rustup component add clippy

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python-version }}

        - name: Lint the Rust binding
          shell: bash
          run: |
            cargo clippy \
              --manifest-path bindings/python/Cargo.toml \
              --all-targets -- \
              -D clippy::all \
              -D clippy::pedantic \
              -D clippy::nursery \
              -D clippy::perf

        - name: Run the gates
          shell: bash
          # Invoked through `bash` rather than `./gates.sh` so the step does not
          # depend on the executable bit surviving in git.
          run: bash ./scripts/gates.sh

    wheels:
        # abi3 means one wheel covers CPython 3.8 and later, so the matrix
        # varies the platform and the Python used to *build* it, not the
        # minimum it runs on.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    # An Intel runner, because an x86_64 wheel cannot be
                    # installed on an arm64 one. Both macOS entries cannot
                    # share `macos-latest`, which is arm64: cross compiling
                    # produced a correct x86_64 wheel that the test step then
                    # refused to install.
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        runs-on: ${{ matrix.os }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: "3.12"

        - name: Build the wheel
          uses: PyO3/maturin-action@v1
          with:
              # `uv build` emits `linux_x86_64`, which PyPI rejects: a Linux
              # wheel has to be manylinux, and so has to be built inside a
              # manylinux container. This action does that for Linux, builds on
              # the host for macOS and Windows, and installs the Rust target
              # itself. Receiving the target directly is also what removes the
              # `--target` plumbing: `uv build` had no such option, so the
              # target had to go in through CARGO_BUILD_TARGET, and without that
              # both macOS legs built the arm64 host wheel and both passed every
              # assertion below, on the same architecture, twice.
              target: ${{ matrix.target }}
              # 2_17, not `auto`, so the tag cannot drift when the action's
              # default changes. glibc 2.17 is the oldest Rust supports on this
              # target, and the lower the requirement the more machines can
              # install the wheel without compiling it.
              manylinux: "2_17"
              # `--compatibility pypi` runs PyPI's own platform tag validation
              # as part of the build, so a tag PyPI would refuse fails the build
              # here rather than the upload in the release workflow.
              args: >-
                  --out dist
                  --compatibility pypi
                  --manifest-path bindings/python/Cargo.toml

        - name: Check the wheel installs and works
          shell: bash
          run: |
            # The wheel must be the one this matrix entry was asked for. Testing
            # it is not evidence of what it is: the assertions below all pass on
            # an arm64 wheel on an arm64 runner, whatever was asked for.
            wheels=(dist/*.whl)
            if [ "${#wheels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one wheel in dist, found ${#wheels[@]}."
              exit 1
            fi
            name=$(basename "${wheels[0]}")
            # The architecture, derived from the target triple, because the two
            # spell it differently: the triple says aarch64 and pc-windows-msvc,
            # the wheel tag says arm64 and win_amd64. A target with no rule here
            # fails rather than passing unchecked, since a wheel whose
            # architecture was never verified is the bug this is here to catch.
            case "${{ matrix.target }}" in
              aarch64-*)      want=arm64 ;;
              *-windows-msvc) want=amd64 ;;
              x86_64-*)       want=x86_64 ;;
              *)
                echo "::error::No wheel architecture is known for ${{ matrix.target }}. Add a rule for it."
                exit 1
                ;;
            esac
            # The platform tag is whatever follows the last hyphen. `x86_64`
            # cannot be found by splitting on underscores, because it contains
            # one: that yields 64.
            plat="${name%.whl}"; plat="${plat##*-}"
            echo "built $name -> $plat (want $want)"
            # The architecture is bounded by a hyphen or an underscore, since
            # the platform tag's own components are joined with underscores:
            # macosx_11_0_arm64, win_amd64, manylinux_2_17_x86_64.
            case "$plat" in
              *-"$want"|*_"$want") ;;
              *)
                echo "::error::$name has platform tag $plat, which does not end in $want as ${{ matrix.target }} requires."
                exit 1
                ;;
            esac

            uv venv --quiet .wheelcheck
            uv pip install --quiet --python .wheelcheck dist/*.whl
            # Run through `uv run`, not `.wheelcheck/bin/python`. A venv on
            # Windows puts the interpreter in `Scripts`, so the hard-coded path
            # is not executable there and the step fails with exit 127.
            # A wheel that installs but cannot detect anything is worse than no
            # wheel, so the check is a real detection rather than an import.
            uv run --no-project --python .wheelcheck python -c "
            from magical_py import FileKind, detect_bytes, bytes_read
            assert detect_bytes(b'\x89PNG\r\n\x1a\n' + b'\0' * 40) is FileKind.Png
            assert detect_bytes(b'nothing here') is None
            assert bytes_read() == 36_870
            assert len(FileKind) == 114
            print('wheel OK')
            "

        - name: Upload the wheel
          uses: actions/upload-artifact@v4
          with:
              name: wheel-${{ matrix.target }}
              path: dist/*.whl
