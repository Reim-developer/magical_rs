name: Test the Python bindings.

on:
    push:
        branches: [ "master", "dev" ]
        paths:
            - "bindings/**"
            - "src/**"
            - "readme.md"
            - "tests/**"
            # The release machinery is part of the bindings, so editing it gets
            # the same gate as editing the code it releases.
            - ".github/workflows/python_bindings.yml"
            - ".github/workflows/publish.yml"

    # No `paths` filter here, deliberately, and not for cost reasons. These
    # jobs are required status checks on master, and a required check that
    # never reports is a merge that is blocked forever. A pull request that
    # touches only CHANGELOG.md would skip a filtered workflow entirely, and
    # GitHub would wait on a check that was never going to arrive. The filter
    # stays on `push` above, where nothing is waiting on a result.
    pull_request:

env:
  CARGO_TERM_COLOR: always
  # The extension has no Python dependency to link against, so nothing here
  # should reach for one.
  PYO3_NO_PYTHON: "1"

jobs:
    checks:
        # One platform is enough to catch a mistake in the Rust or Python
        # source. What differs per platform is the linker, so the wheel
        # matrix below covers that separately.
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # The package declares requires-python >= 3.8, so the floor is
                # tested as well as a current release. A single interpreter
                # would not do: Python 3.8's pydoc renders `help()` without
                # enum member docstrings, which 3.9 and later do render, so the
                # readme claims and the tests only agreed on 3.9+.
                python-version: [ "3.8", "3.12" ]

        env:
            # uv picks whichever interpreter it likes when left to itself, which
            # would quietly make the matrix meaningless.
            UV_PYTHON: ${{ matrix.python-version }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Add Rust component
          shell: bash
          run: rustup component add clippy

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python-version }}

        - name: Lint the Rust binding
          shell: bash
          run: |
            cargo clippy \
              --manifest-path bindings/python/Cargo.toml \
              --all-targets -- \
              -D clippy::all \
              -D clippy::pedantic \
              -D clippy::nursery \
              -D clippy::perf

        - name: Run the gates
          shell: bash
          # Invoked through `bash` rather than `./gates.sh` so the step does not
          # depend on the executable bit surviving in git.
          run: bash ./bindings/python/gates.sh

    wheels:
        # abi3 means one wheel covers CPython 3.8 and later, so the matrix
        # varies the platform and the Python used to *build* it, not the
        # minimum it runs on.
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      arch: x86_64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      arch: arm64
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      arch: x86_64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      arch: amd64

        runs-on: ${{ matrix.os }}

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Install Rust
          shell: bash
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin:$PATH" >> "$GITHUB_PATH"

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: "3.12"

        - name: Build the wheel
          shell: bash
          env:
              # `uv build` has no `--target`, so this is how the target reaches
              # maturin. Without it maturin builds for the *host*, and both
              # macOS legs run on the same arm64 runner, so both produced a
              # wheel named `...macosx_11_0_arm64.whl`. Both then passed every
              # assertion below, on the same architecture, twice.
              CARGO_BUILD_TARGET: ${{ matrix.target }}
          run: |
            rustup target add ${{ matrix.target }}
            # `--python`, not `--interpreter`: `uv build` has no such flag and
            # exits 2 without building anything.
            uv build bindings/python \
              --out-dir dist \
              --python python

        - name: Check the wheel installs and works
          shell: bash
          run: |
            # The wheel must be the one this matrix entry was asked for. Testing
            # it is not evidence of what it is: the assertions below all pass on
            # an arm64 wheel on an arm64 runner, whatever was asked for.
            wheels=(dist/*.whl)
            if [ "${#wheels[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one wheel in dist, found ${#wheels[@]}."
              exit 1
            fi
            name=$(basename "${wheels[0]}")
            # The platform tag is whatever follows the last hyphen. `x86_64`
            # cannot be found by splitting on underscores, because it contains
            # one: that yields 64.
            plat="${name%.whl}"; plat="${plat##*-}"
            echo "built $name -> $plat"
            # The architecture is bounded by a hyphen or an underscore, since
            # the platform tag's own components are joined with underscores:
            # macosx_11_0_arm64, win_amd64, linux_x86_64.
            case "$plat" in
              *-"${{ matrix.arch }}"|*_"${{ matrix.arch }}") ;;
              *)
                echo "::error::$name has platform tag $plat, which does not end in ${{ matrix.arch }} as ${{ matrix.target }} requires."
                exit 1
                ;;
            esac

            uv venv --quiet .wheelcheck
            uv pip install --quiet --python .wheelcheck dist/*.whl
            # Run through `uv run`, not `.wheelcheck/bin/python`. A venv on
            # Windows puts the interpreter in `Scripts`, so the hard-coded path
            # is not executable there and the step fails with exit 127.
            # A wheel that installs but cannot detect anything is worse than no
            # wheel, so the check is a real detection rather than an import.
            uv run --no-project --python .wheelcheck python -c "
            from magical_py import FileKind, detect_bytes, bytes_read
            assert detect_bytes(b'\x89PNG\r\n\x1a\n' + b'\0' * 40) is FileKind.Png
            assert detect_bytes(b'nothing here') is None
            assert bytes_read() == 36_870
            assert len(FileKind) == 114
            print('wheel OK')
            "

        - name: Upload the wheel
          uses: actions/upload-artifact@v4
          with:
              name: wheel-${{ matrix.target }}
              path: dist/*.whl
