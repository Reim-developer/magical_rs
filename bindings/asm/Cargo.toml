[package]
name = "magical-asm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The WebAssembly module behind @reim-developer/magical-js: raw extern \"C\" exports over magical_rs, with no imports and no glue file."
repository = "https://github.com/Reim-developer/magical_rs"
homepage = "https://github.com/Reim-developer/magical_rs/blob/master/bindings/asm"
documentation = "https://docs.rs/magical_rs"
# Not published to crates.io, and not to npm either: the *package* on npm is
# `bindings/nodejs`, which is JavaScript plus the `.wasm` this crate builds. This
# crate exists to be that module and to keep the binding's Rust dependency-free,
# which it does by depending on the library by path rather than by version.
publish = false

[lib]
# `cdylib` is the WebAssembly module Node loads. `rlib` is kept so the crate's
# own tests can link it and call the exports directly as Rust functions, which is
# what makes the ABI testable without a wasm runtime in the loop.
name = "magical_js"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dependency, not a registry dependency: the module always builds against the
# checkout it sits next to, so the two cannot drift apart. The library name is
# `magical_rs`; the crate here is `magical-asm`.
magical_rs = { path = "../../crates/magical_rs", default-features = false, features = ["std"] }

[profile.release]
# Two things pull in opposite directions here and the size wins, because the whole
# point of shipping a wasm module is how much of it a browser or a Node process
# downloads.
#
# `"s"` over `"z"` because `"z"` is *larger* here, which is the opposite of what this
# comment used to say. It claimed the difference was 243 bytes in the other
# direction, and nobody could reproduce the figure because nothing in the repository
# measured it. `node scripts/wasm_sizes.mjs` does, and prints:
#
#     "s"    44,616 raw / 17,771 gzip     <- this file
#     "z"    44,812 raw / 18,057 gzip     +196
#     3      43,606 raw / 17,284 gzip   -1,010
#     2      44,463 raw / 17,582 gzip     -153
#
# The reason `"z"` loses is the table: 114 entries are encoded into linear memory at
# import, that blob is close to incompressible already, and `z` has nothing left to
# take from it. Only the code around it is being optimised.
#
# Which also means this is not a measured optimum. `3` is both smaller *and* faster
# than `"s"`, and the spread across all four is 2.3% of the module. `"s"` is kept
# because it is the middle of a range where none of the choices matters much and
# there is no benchmark in this repository that would justify moving: `sizes` is a
# reasonable default, and saying so is more useful than dressing it up.
#
# These figures are 1,404 larger than the ones this comment carried before the
# detection index in `crates/magical_rs/src/magical/dispatch.rs`, which took
# matching from 525 ns to 31 ns on a file the table does not recognise. 3.2% for
# 17x on the common case, which is why it is stated rather than quietly absorbed.
#
# And 38 larger than the figures above, because `read_file_header` no longer wraps
# the file in a `BufReader`. That is a trade the same comment's own reasoning
# argues against and it was taken anyway: 45,184 -> 45,222 raw is +0.08%, and
# 18,024 -> 18,047 gzip is +0.13%. For it, reading a file by path is 12% faster
# (34.2 us -> 30.6 us per file, 24 files, median of 9 passes).
#
# Two things about those bytes. They are **not** from adding
# `read_file_header_into` — a build with the wrapper removed entirely measures the
# same 45,222, so it is the rewrite of `read_file_header` and nothing else. And
# this module never calls it: wasm has no file paths, so `read_file_header` sits
# in the rlib as an unreferenced public symbol and the linker keeps it anyway. The
# bytes are spent on nothing this module can use — recorded here because a comment
# that says "the size wins" and then hands out 0.08% without saying so is worse
# than one that does.
#
# An earlier version of that change measured 45,375 and the difference is why the
# figure is stated rather than trusted: the reader now clears the caller's buffer
# *before* `File::open` rather than after, so a failed open leaves the buffer
# empty instead of full of zeros — and that reordering alone was worth 153 bytes.
# A size comment is only as good as the build it was taken from.
opt-level = "s"
lto = true
codegen-units = 1
# A wasm module that panics has nowhere to unwind to, and the only useful thing
# it can do is trap. Every entry point below is written not to panic; this is the
# backstop, not the mechanism.
panic = "abort"
strip = true
