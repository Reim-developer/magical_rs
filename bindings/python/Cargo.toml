[package]
name = "magical-py"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native Python bindings for magical_rs, a zero-dependency file type detection library."
repository = "https://github.com/Reim-developer/magical_rs"
homepage = "https://github.com/Reim-developer/magical_rs/blob/master/bindings/python"
documentation = "https://docs.rs/magical_rs"
# This crate is published to PyPI, not to crates.io. It exists to be a path
# dependency next to the crate it wraps, and to keep that crate dependency-free.
publish = false

[lib]
# `cdylib` produces the importable extension module. `rlib` is kept so the
# crate's own tests can link it normally.
name = "_magical_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path dependency, not a registry dependency: the binding always builds
# against the checkout it sits next to, so the two cannot drift apart.
magical_rs = { path = "../..", default-features = false, features = ["std"] }

[dependencies.pyo3]
version = "0.29.2"
# `abi3-py38` builds a single wheel that loads on CPython 3.8 and later.
# `extension-module` stops the crate linking libpython, which is required
# when building an extension module.
features = ["abi3-py38", "extension-module"]

[profile.release]
# Extension modules are loaded into a Python process, so build speed matters
# far more than the last few percent of throughput here.
lto = "thin"
codegen-units = 1
