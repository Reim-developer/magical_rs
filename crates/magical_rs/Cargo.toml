[package]
name = "magical_rs"
description = """Rust framework for file recognition, aiming for high extensibility and customization."""
version = "0.6.5"
edition = "2024"
license = "MIT"
keywords = ["detect-file", "no-dependency", "no-std", "magic", "rlib"]
categories = ["filesystem", "no-std", "asynchronous"]
# `readme` is the checked-in copy beside this manifest, and it is a copy for the
# same reason `LICENSE` and `CHANGELOG.md` are: `src/lib.rs` reaches it with
# `include_str!`, and the published crate is not the source tree. Cargo copies
# whatever `readme` names into the archive as `readme.md` at the package root, so
# naming the repository's own readme two levels up shipped an archive whose
# `src/lib.rs` pointed at a file that was not in it — and `cargo publish` failed
# on the verify step with `couldn't read src/../../../readme.md`.
#
# The repository's readme is the one a human edits. This file is checked in beside
# the manifest, and `tests/packaging.rs` fails and names both paths if they ever
# differ, which is the only thing making a checked-in copy safe.
readme = "readme.md"
include = ["src/**/*.rs", "LICENSE", "CHANGELOG.md", "readme.md"]
authors = ["Reim-developer", "contact.kaxtr@gmail.com"]
repository = "https://github.com/reim-developer/magical_rs"

[lib]
crate-type = ["lib"]

[features]
default = ["std"]
std = []
magical_dyn = []
magical_async_dyn = []
unsafe_context = []
# `bytes.detect()` instead of `FileKind::match_types(&bytes)`. Gated because it
# puts a method on `[u8]`, which is a dependency a caller takes on a type they do
# not own and cannot opt out of afterwards — so it is opt-in rather than a
# default. Nothing else in the crate is gated for that reason: a `macro_rules!`
# costs nothing until invoked, and this costs a name in a namespace.
#
# The table of what each feature does is in the readme; this comment says only why
# *this* one is gated.
magical_fluent = []

[dependencies]
