[package]
name = "magical_rs"
description = """Rust framework for file recognition, aiming for high extensibility and customization."""
version = "0.6.4"
edition = "2024"
license = "MIT"
keywords = ["detect-file", "no-dependency", "no-std", "magic", "rlib"]
categories = ["filesystem", "no-std", "asynchronous"]
# `readme` is the repository's own readme, one level up and two across.
# Cargo copies a readme from outside the package into the published
# archive as `readme.md`, so the published docs and the repository
# document are one file rather than two that can disagree. It is
# `readme` and not `include` that does this: `include` silently ignores
# a `..` segment, so the `LICENSE` that used to be listed here would
# have stopped being packaged without a word. `LICENSE` beside this
# manifest is what ships, and `tests/workspace.rs` checks it is
# byte-identical to the one at the repository root.
readme = "../../readme.md"
include = ["src/**/*.rs", "LICENSE", "CHANGELOG.md"]
authors = ["Reim-developer", "contact.kaxtr@gmail.com"]
repository = "https://github.com/reim-developer/magical_rs"

[lib]
crate-type = ["lib"]

[features]
default = ["std"]
std = []
magical_dyn = []
magical_async_dyn = []
unsafe_context = []
# `bytes.detect()` instead of `FileKind::match_types(&bytes)`. Gated because it
# puts a method on `[u8]`, which is a dependency a caller takes on a type they do
# not own and cannot opt out of afterwards — so it is opt-in rather than a
# default. Nothing else in the crate is gated for that reason: a `macro_rules!`
# costs nothing until invoked, and this costs a name in a namespace.
#
# The table of what each feature does is in the readme; this comment says only why
# *this* one is gated.
magical_fluent = []

[dependencies]
